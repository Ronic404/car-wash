services:
  postgres:
    image: postgres:15-alpine
    container_name: car-wash-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carwash
      POSTGRES_PASSWORD: carwash123
      POSTGRES_DB: car_wash
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwash"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

